[project]
name = "docmind"
version = "0.1.0"
description = "Local-first document intelligence agent with swappable remote LLM providers"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "lancedb>=0.13",
    "pyarrow>=15.0",
    "ollama>=0.3",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]

[project.scripts]
docmind = "docmind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docmind"]
